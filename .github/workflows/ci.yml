name: Android and DSP CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-dsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host C++ tests
        run: |
          cmake -S native-tests -B /tmp/dautotune-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/dautotune-tests -j 2
          ctest --test-dir /tmp/dautotune-tests --output-on-failure
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Compile debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: D-Autotune-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
